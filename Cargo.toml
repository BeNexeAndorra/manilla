[workspace]
members = ["core", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# El servidor ha de sobreviure a un panic d'una petició: amb "abort" el
# procés sencer cauria. El WASM creix una mica i val la pena.
panic = "unwind"
strip = true
